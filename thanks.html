<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了｜大阪産業医事務所</title>
<meta name="robots" content="noindex, follow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: #f7f8fa;
    color: #2c2c2c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #1a3557;
    padding: 20px 32px;
  }
  .logo {
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .logo span {
    display: inline-block;
    background: #2a7a8c;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: middle;
  }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 32px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 48px 40px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  }
  .icon {
    width: 64px; height: 64px;
    background: #e8f4f7;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #1a3557;
    margin-bottom: 16px;
  }
  p {
    font-size: 15px;
    line-height: 1.85;
    color: #555;
    margin-bottom: 12px;
  }
  .back-btn {
    display: inline-block;
    margin-top: 28px;
    background: #1a3557;
    color: #fff;
    padding: 14px 28px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.2s;
  }
  .back-btn:hover { background: #122540; }
  footer {
    background: #122540;
    color: rgba(255,255,255,0.5);
    text-align: center;
    padding: 20px 32px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo"><span>精神科医 × 産業医</span>大阪産業医事務所</a>
</header>

<main>
  <div class="card">
    <div class="icon">✓</div>
    <h1>送信が完了しました</h1>
    <p>お問い合わせいただき、ありがとうございます。</p>
    <p>内容を確認のうえ、担当者より2〜3営業日以内にご連絡いたします。</p>
    <p>お急ぎの場合は、直接メールにてご連絡ください。<br>
    <a href="mailto:medworkacademy@gmail.com" style="color:#2a7a8c;">medworkacademy@gmail.com</a></p>
    <a href="/" class="back-btn">トップページへ戻る</a>
  </div>
</main>

<footer>
  <p>© 2026 大阪産業医事務所 / メドワークアカデミー合同会社</p>
</footer>

</body>
</html>
